<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlowLine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FlowLine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap">
<style>
:root{--bg:#F8F4EF;--surface:#FFFFFF;--ink:#2B2623;--muted:#6A615A;--accent:#4F7F72;--accent-ink:#FFFFFF;--line:#E3DACF;--soft:#F0E8DE;--danger:#B04A3C;--shadow:0 1px 2px rgba(80,55,30,.07),0 6px 16px rgba(80,55,30,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1613;--surface:#252019;--ink:#F2ECE6;--muted:#ADA39A;--accent:#8FC0B0;--accent-ink:#13201B;--line:#3B342D;--soft:#2E2721;--danger:#EE9082;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1613;--surface:#252019;--ink:#F2ECE6;--muted:#ADA39A;--accent:#8FC0B0;--accent-ink:#13201B;--line:#3B342D;--soft:#2E2721;--danger:#EE9082;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;min-height:100%;margin:0 auto;padding:20px 20px 28px;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
h1{font-size:2rem;font-weight:500;line-height:1.2}
h2{font-size:1.25rem;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.9rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:16px;min-height:52px;padding:0 20px;background:var(--soft);color:var(--ink)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:500}
.ghost{background:transparent;color:var(--muted);padding:0 12px;min-height:44px}
.danger{background:transparent;color:var(--muted);text-decoration:underline}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;min-height:44px}
.routine{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:22px 24px;min-height:96px;background:var(--surface);border:2px solid var(--line);justify-content:center}
.routine b{font-size:1.5rem;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
input[type=text],select{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs{overflow-x:auto}
.tabs button{flex:1 0 auto;padding:0 14px;font-size:.9rem}
.chip{flex:1;min-height:40px;padding:0;font-size:.8rem;border-radius:12px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.tabs .on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{min-width:48px;padding:0}
.kid{flex:1;display:flex;flex-direction:column}
.kidmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:12px 4px}
.kidmain h1{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:500;line-height:1.1}
.kidmain p{font-size:1.35rem}
.big{min-height:80px;font-size:1.5rem;width:100%;border-radius:22px}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--accent)}
.dot.now{background:transparent;box-shadow:inset 0 0 0 3px var(--accent)}
.week{display:flex;gap:6px;margin:6px 0 14px}
.day{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.day i{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--line)}
.day.yes i{background:var(--accent);border-color:var(--accent)}
.center{text-align:center;align-items:center}
@media (prefers-reduced-motion:no-preference){.kidmain{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
[data-c=coral]{--cl:#B94E34;--cd:#F0907A}
[data-c=sunset]{--cl:#B5531A;--cd:#F4A06B}
[data-c=marigold]{--cl:#9A6208;--cd:#F2B45C}
[data-c=rose]{--cl:#BD4F78;--cd:#F08FAF}
[data-c=plum]{--cl:#8F4687;--cd:#D49BCB}
[data-c=sage]{--cl:#4F7F72;--cd:#8FC0B0}
[data-c]{--accent:var(--cl);--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-c]{--accent:var(--cd);--accent-ink:#1A1310}}
body[data-c]{background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.routine[data-c]{border-color:var(--accent)}
.card,.routine{box-shadow:var(--shadow)}
.danger{color:var(--danger)}
.sw{width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;background:var(--accent);flex:0 0 auto}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.dot{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.dot.done{background:var(--accent);box-shadow:none}
.dot.now{box-shadow:inset 0 0 0 3px var(--accent)}
.day i{border-color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>

var toastEl=null,toastT=0;

var S=load(),V={name:'home'},armed=null,focusId=null,pickId=null,daysId=null;
var unlocked=false,fails=0,lockUntil=0,lastTouch=Date.now(),GATED={parent:1,kidnew:1,kidedit:1,edit:1,backup:1,weather:1};

  if(GATED[v.name]&&!unlocked)V={name:'pin',mode:S.pin?'enter':'set',next:v,buf:'',first:'',err:''};else V=v;
  render();window.scrollTo(0,0)}
document.addEventListener('pointerdown',function(){lastTouch=Date.now()});

function h(tag,p){var e=document.createElement(tag);p=p||{};for(var k in p){if(k.slice(0,2)==='on')e[k]=p[k];else if(k==='text')e.textContent=p[k];else e.setAttribute(k,p[k])}

function stepOn(k,r,t){if(t.days&&t.days[todayIdx()]===false)return false;
  if(t.weekly){var d=S.wdone[k+':'+r+':'+t.id];if(d&&d>=weekStart()&&d<dayStr(0))return false}return true}
function stepsFor(k,r){var td=dayStr(0);return tasksOf(k,r).filter(function(t){return (t.title||'').trim()&&stepOn(k,r,t)}).concat(wxExtra(r)).concat(S.once.filter(function(o){return o.kid===k&&o.rid===r&&o.date===td&&o.title.trim()}))}
function todayIdx(){return (new Date().getDay()+6)%7}
function onDay(k,r,d){var a=S.days[k+':'+r];return !a||a[d]!==false}
function doneToday(k,r){return S.log.some(function(l){return l.kid===k&&l.rid===r&&dayKey(l.t)===dayKey(Date.now())})}
var ICONS=[[/\bart\b|draw/i,'🎨'],[/plant/i,'🌱'],[/\bmail\b/i,'📬'],[/bike|movement/i,'🚲'],[/calm|mindful|breath|stretch/i,'🧘'],[/kindness|gratitude|thank/i,'💌'],[/check in/i,'📞'],[/skill|drill|hoops/i,'⚽'],[/teeth|tooth|brush/i,'🪥'],[/dress|clothes/i,'👕'],[/breakfast|cereal/i,'🥣'],[/shoe|sock/i,'👟'],[/backpack|bag/i,'🎒'],[/toilet|bathroom|restroom|potty/i,'🚽'],[/shower|bath/i,'🚿'],[/pajama|pjs/i,'🌙'],[/book|read/i,'📖'],[/snack|fruit/i,'🍎'],[/hand|wash/i,'🧼'],[/lunch/i,'🥪'],[/dinner|table|meal|dish/i,'🍽️'],[/homework/i,'✏️'],[/light|bed|sleep/i,'😴'],[/dog|pet|feed/i,'🐕'],[/trash|garbage/i,'🗑️'],[/hair|comb/i,'🪮'],[/tidy|clean|room|toy/i,'🧹'],[/water|drink|bottle/i,'💧'],[/coat|jacket|hat/i,'🧥'],[/music|practice|instrument/i,'🎵'],[/door|leave|bus/i,'🚪'],[/vitamin|medicine/i,'💊'],[/laundry|hamper/i,'🧺'],[/floss/i,'🦷']];
function iconOf(t){if(t.icon==='none')return '';if(t.icon)return t.icon;for(var i=0;i<ICONS.length;i++)if(ICONS[i][0].test(t.title||''))return ICONS[i][1];return ''}

var PICKS=['🪥','🧼','🚿','👕','👟','🧦','🎒','🥣','🍎','🥪','🍽️','🥛','📖','✏️','🧩','🎨','⚽','🚲','🐕','🐈','🌱','🧺','🛏️','🗑️','🧹','🌙','😴','☀️','🚪','🧥','🧢','💧','🎵','🦷','🪮','⏰','🚌','🏫','👋','💊','🚽'];

  return h('div',{class:'stack'},row,h('button',{class:'chip'+(t.weekly?' on':''),style:'min-height:44px;flex:none;padding:0 14px','aria-pressed':t.weekly?'true':'false',onclick:function(){t.weekly=!t.weekly;save();render()},text:'Only once a week'}),

  var g=h('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px'});

}
var PAL=[['coral','Coral'],['sunset','Orange'],['marigold','Gold'],['rose','Rose'],['plum','Plum'],['sage','Green']];
function kidColor(k){for(var i=0;i<PAL.length;i++)if(PAL[i][0]===k.color)return k.color;return PAL[Math.max(0,S.kids.indexOf(k))%PAL.length][0]}
function swatches(k){var row=h('div',{class:'row',style:'flex-wrap:wrap;gap:12px'}),cur=kidColor(k);
  PAL.forEach(function(p){row.appendChild(h('button',{class:'sw'+(cur===p[0]?' on':''),'data-c':p[0],'aria-label':p[1],'aria-pressed':cur===p[0]?'true':'false',onclick:function(){k.color=p[0];save();render()}}))});return row}

function wxFill(el,a){el.textContent='';el.appendChild(h('div',{style:'font-size:2.4rem;line-height:1','aria-hidden':'true',text:a.icon}));
  el.appendChild(h('div',{class:'grow'},h('div',{style:'font-size:1.15rem;font-weight:500',text:a.text}),h('div',{class:'muted small',text:a.sub})));el.style.display=''}

    .then(function(r){return r.json()}).then(function(j){var a=wxAdvice(j);if(!a)return;w.cache={t:Date.now(),d:dayStr(0),a:a};save();wxFill(el,a);if(V.name==='kidhome')render()}).catch(function(){})}catch(e){}}
function weather(){
  var w=S.weather,msg=h('p',{class:'muted small',text:''}),res=h('div',{class:'stack'}),inp=h('input',{type:'text',placeholder:'City (for example, Everett)','aria-label':'City'});
