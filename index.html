<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlowLine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FlowLine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap">
<style>
:root{--bg:#F8F4EF;--surface:#FFFFFF;--ink:#2B2623;--muted:#6A615A;--accent:#4F7F72;--accent-ink:#FFFFFF;--line:#E3DACF;--soft:#F0E8DE;--danger:#B04A3C;--shadow:0 1px 2px rgba(80,55,30,.07),0 6px 16px rgba(80,55,30,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1613;--surface:#252019;--ink:#F2ECE6;--muted:#ADA39A;--accent:#8FC0B0;--accent-ink:#13201B;--line:#3B342D;--soft:#2E2721;--danger:#EE9082;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1613;--surface:#252019;--ink:#F2ECE6;--muted:#ADA39A;--accent:#8FC0B0;--accent-ink:#13201B;--line:#3B342D;--soft:#2E2721;--danger:#EE9082;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;min-height:100%;margin:0 auto;padding:20px 20px 28px;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
h1{font-size:2rem;font-weight:500;line-height:1.2}
h2{font-size:1.25rem;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.9rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:16px;min-height:52px;padding:0 20px;background:var(--soft);color:var(--ink)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:500}
.ghost{background:transparent;color:var(--muted);padding:0 12px;min-height:44px}
.danger{background:transparent;color:var(--muted);text-decoration:underline}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;min-height:44px}
.routine{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;padding:22px 24px;min-height:96px;background:var(--surface);border:2px solid var(--line);justify-content:center}
.routine b{font-size:1.5rem;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
input[type=text],select{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs{overflow-x:auto}
.tabs button{flex:1 0 auto;padding:0 14px;font-size:.9rem}
.chip{flex:1;min-height:40px;padding:0;font-size:.8rem;border-radius:12px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.tabs .on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{min-width:48px;padding:0}
.kid{flex:1;display:flex;flex-direction:column}
.kidmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:12px 4px}
.kidmain h1{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:500;line-height:1.1}
.kidmain p{font-size:1.35rem}
.big{min-height:80px;font-size:1.5rem;width:100%;border-radius:22px}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--accent)}
.dot.now{background:transparent;box-shadow:inset 0 0 0 3px var(--accent)}
.week{display:flex;gap:6px;margin:6px 0 14px}
.day{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.day i{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--line)}
.day.yes i{background:var(--accent);border-color:var(--accent)}
.center{text-align:center;align-items:center}
@media (prefers-reduced-motion:no-preference){.kidmain{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
[data-c=coral]{--cl:#B94E34;--cd:#F0907A}
[data-c=sunset]{--cl:#B5531A;--cd:#F4A06B}
[data-c=marigold]{--cl:#9A6208;--cd:#F2B45C}
[data-c=rose]{--cl:#BD4F78;--cd:#F08FAF}
[data-c=plum]{--cl:#8F4687;--cd:#D49BCB}
[data-c=sage]{--cl:#4F7F72;--cd:#8FC0B0}
[data-c]{--accent:var(--cl);--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-c]{--accent:var(--cd);--accent-ink:#1A1310}}
body[data-c]{background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.routine[data-c]{border-color:var(--accent)}
.card,.routine{box-shadow:var(--shadow)}
.danger{color:var(--danger)}
.sw{width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;background:var(--accent);flex:0 0 auto}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.dot{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.dot.done{background:var(--accent);box-shadow:none}
.dot.now{box-shadow:inset 0 0 0 3px var(--accent)}
.day i{border-color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY='flowline.v2';

rs.forEach(function(r){s.tasks[k.id+':'+r.id]=defTasks(r.name)});return s}

var toastEl=null,toastT=0;

function save(){var ok=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}if(ok)toast()}
var S=load(),V={name:'home'},armed=null,focusId=null,pickId=null;
var unlocked=false,fails=0,lockUntil=0,lastTouch=Date.now(),GATED={parent:1,kidnew:1,kidedit:1,edit:1,backup:1,weather:1};
function go(v){armed=null;pickId=null;if(!GATED[v.name])unlocked=false;
  if(GATED[v.name]&&!unlocked)V={name:'pin',mode:S.pin?'enter':'set',next:v,buf:'',first:'',err:''};else V=v;
  render();window.scrollTo(0,0)}
document.addEventListener('pointerdown',function(){lastTouch=Date.now()});
setInterval(function(){if(unlocked&&Date.now()-lastTouch>300000)go({name:'home'})},15000);
function h(tag,p){var e=document.createElement(tag);p=p||{};for(var k in p){if(k.slice(0,2)==='on')e[k]=p[k];else if(k==='text')e.textContent=p[k];else e.setAttribute(k,p[k])}
for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c)}return e}
function by(a,id){return a.filter(function(x){return x.id===id})[0]}
function tasksOf(k,r){var key=k+':'+r;return S.tasks[key]||(S.tasks[key]=[])}
function bonusOf(k,r){var key=k+':'+r;return S.bonus[key]||(S.bonus[key]=[])}
function bonusCsv(){var rows=['date,child,routine,bonus,reward,given'];S.bonusLog.forEach(function(b){var k=by(S.kids,b.kid),r=by(S.routines,b.rid);rows.push([new Date(b.t).toLocaleDateString('en-CA'),k?k.name:'',r?r.name:'',b.title,b.reward,b.given?'yes':'no'].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(','))});return rows.join('\n')}
function dayStr(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function stepsFor(k,r){var td=dayStr(0);return tasksOf(k,r).filter(function(t){return (t.title||'').trim()}).concat(wxExtra(r)).concat(S.once.filter(function(o){return o.kid===k&&o.rid===r&&o.date===td&&o.title.trim()}))}
function todayIdx(){return (new Date().getDay()+6)%7}
function onDay(k,r,d){var a=S.days[k+':'+r];return !a||a[d]!==false}
function doneToday(k,r){return S.log.some(function(l){return l.kid===k&&l.rid===r&&dayKey(l.t)===dayKey(Date.now())})}
var ICONS=[[/teeth|tooth|brush/i,'🪥'],[/dress|clothes/i,'👕'],[/breakfast|cereal/i,'🥣'],[/shoe|sock/i,'👟'],[/backpack|bag/i,'🎒'],[/toilet|bathroom|restroom|potty/i,'🚽'],[/shower|bath/i,'🚿'],[/pajama|pjs/i,'🌙'],[/book|read/i,'📖'],[/snack|fruit/i,'🍎'],[/hand|wash/i,'🧼'],[/lunch/i,'🥪'],[/dinner|table|meal|dish/i,'🍽️'],[/homework/i,'✏️'],[/light|bed|sleep/i,'😴'],[/dog|pet|feed/i,'🐕'],[/trash|garbage/i,'🗑️'],[/hair|comb/i,'🪮'],[/tidy|clean|room|toy/i,'🧹'],[/water|drink|bottle/i,'💧'],[/coat|jacket|hat/i,'🧥'],[/music|practice|instrument/i,'🎵'],[/door|leave|bus/i,'🚪'],[/vitamin|medicine/i,'💊'],[/laundry|hamper/i,'🧺'],[/floss/i,'🦷']];
function iconOf(t){if(t.icon==='none')return '';if(t.icon)return t.icon;for(var i=0;i<ICONS.length;i++)if(ICONS[i][0].test(t.title||''))return ICONS[i][1];return ''}
function iconBtn(t){return iconOf(t)||'Pick'}
var PICKS=['🪥','🧼','🚿','👕','👟','🧦','🎒','🥣','🍎','🥪','🍽️','🥛','📖','✏️','🧩','🎨','⚽','🚲','🐕','🐈','🌱','🧺','🛏️','🗑️','🧹','🌙','😴','☀️','🚪','🧥','🧢','💧','🎵','🦷','🪮','⏰','🚌','🏫','👋','💊','🚽'];
function picker(t){
  var g=h('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px'});
  PICKS.forEach(function(e){g.appendChild(h('button',{style:'min-height:52px;padding:0;font-size:1.6rem','aria-label':'Use '+e,onclick:function(){t.icon=e;pickId=null;save();render()},text:e}))});
  return h('div',{class:'stack'},h('span',{class:'muted small',text:'Pick a picture'}),g,
    h('div',{class:'row'},h('button',{class:'grow',onclick:function(){t.icon='';pickId=null;save();render()},text:'Automatic'}),h('button',{class:'grow',onclick:function(){t.icon='none';pickId=null;save();render()},text:'No picture'})))
}
var PAL=[['coral','Coral'],['sunset','Orange'],['marigold','Gold'],['rose','Rose'],['plum','Plum'],['sage','Green']];
function kidColor(k){for(var i=0;i<PAL.length;i++)if(PAL[i][0]===k.color)return k.color;return PAL[Math.max(0,S.kids.indexOf(k))%PAL.length][0]}
function swatches(k){var row=h('div',{class:'row',style:'flex-wrap:wrap;gap:12px'}),cur=kidColor(k);
  PAL.forEach(function(p){row.appendChild(h('button',{class:'sw'+(cur===p[0]?' on':''),'data-c':p[0],'aria-label':p[1],'aria-pressed':cur===p[0]?'true':'false',onclick:function(){k.color=p[0];save();render()}}))});return row}
function wxAdvice(j){try{var H=j.hourly,t=H.temperature_2m,p=H.precipitation_probability,c=H.weather_code,i,m=999,pr=0,sn=false,rn=false;
  for(i=7;i<=9;i++)if(t[i]!=null)m=Math.min(m,t[i]);
  for(i=7;i<=17;i++){if(p[i]!=null)pr=Math.max(pr,p[i]);var x=c[i];if([71,73,75,77,85,86].indexOf(x)>=0)sn=true;if((x>=51&&x<=67)||(x>=80&&x<=82)||x>=95)rn=true}
  if(m===999)return null;
  var mt=Math.round(m),hi=Math.round(j.daily.temperature_2m_max[0]),sub='Morning '+mt+'°F · High '+hi+'°F';
  if(sn)return{icon:'❄️',text:'Snow today. Wear boots and a warm coat.',sub:sub,cat:'snow'};
  if(mt<=32)return{icon:'🧥',text:'Freezing today. Wear a heavy coat.',sub:sub,cat:'freeze'};
  if(rn||pr>=50)return{icon:'🌧️',text:'Rain likely. Grab a raincoat and boots.',sub:sub,cat:'rain'};
  if(mt<55)return{icon:'🧥',text:'Chilly today. Wear a jacket.',sub:sub,cat:'chilly'};
  return{icon:'☀️',text:'Nice out. No jacket needed.',sub:sub,cat:'nice'}}catch(e){return null}}
function wxFill(el,a){el.textContent='';el.appendChild(h('div',{style:'font-size:2.4rem;line-height:1','aria-hidden':'true',text:a.icon}));
  el.appendChild(h('div',{class:'grow'},h('div',{style:'font-size:1.15rem;font-weight:500',text:a.text}),h('div',{class:'muted small',text:a.sub})));el.style.display=''}
function wxLoad(el){var w=S.weather;if(!w||w.lat==null)return;
  var c=w.cache,sameDay=c&&c.d===dayStr(0)&&c.a&&c.a.cat;
  if(sameDay)wxFill(el,c.a);
  if(sameDay&&Date.now()-c.t<10800000)return;
  try{fetch('https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+'&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1')
    .then(function(r){return r.json()}).then(function(j){var a=wxAdvice(j);if(!a)return;w.cache={t:Date.now(),d:dayStr(0),a:a};save();wxFill(el,a);if(V.name==='kidhome')render()}).catch(function(){})}catch(e){}}
function weather(){
  var w=S.weather,msg=h('p',{class:'muted small',text:''}),res=h('div',{class:'stack'}),inp=h('input',{type:'text',placeholder:'City (for example, Everett)','aria-label':'City'});
  function search(){var q=inp.value.trim();if(q.length<2){msg.textContent='Enter a city name.';return}msg.textContent='Searching…';res.textContent='';
    try{fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=en&format=json').then(function(r){return r.json()}).then(function(j){
      var rs=j.results||[];msg.textContent=rs.length?'Tap your location:':'No match. Try a nearby city.';
      rs.forEach(function(x){var label=[x.name,x.admin1,x.country].filter(Boolean).join(', ');
        res.appendChild(h('button',{onclick:function(){S.weather={name:label,lat:Math.round(x.latitude*100)/100,lon:Math.round(x.longitude*100)/100,cache:null,auto:w&&w.auto,morn:w&&w.morn,aft:w&&w.aft};save();render()},text:label}))})
    }).catch(function(){msg.textContent='Couldn’t reach the weather service. Check the internet connection.'})}catch(e){msg.textContent='Couldn’t reach the weather service.'}}
  var opts=null;
  if(w&&w.lat!=null){
    var rsel=function(label,key){var s=h('select',{'aria-label':label,onchange:function(){w[key]=this.value;save()}});
      s.appendChild(h('option',{value:'',text:'Automatic (by name)'}));
      S.routines.forEach(function(r){s.appendChild(h('option',{value:r.id,text:r.name}))});
      s.appendChild(h('option',{value:'none',text:'None'}));s.value=w[key]||'';
      return h('div',{class:'stack',style:'gap:6px'},h('span',{class:'muted small',text:label}),s)};
    opts=h('div',{class:'card stack'},
      h('div',{class:'row'},h('div',{class:'grow'},h('b',{text:'Add weather steps'}),h('div',{class:'muted small',text:'Adds a jacket or boots step to the morning routine and a hang-it-up step after school.'})),h('button',{onclick:function(){w.auto=(w.auto===false);save();render()},text:w.auto===false?'Turn on':'Turn off'})),
      rsel('Morning routine','morn'),rsel('After-school routine','aft'));
  }
  inp.onkeydown=function(e){if(e.key==='Enter')search()};
  return h('div',{class:'stack'},topBar('‹ Grown-ups',{name:'parent',tab:'today'}),h('h1',{text:'Weather'}),
    h('p',{class:'muted small',text:'Shows a jacket-and-boots hint on each child’s routine list. Your city’s rounded coordinates (no names or routines) are sent to Open-Meteo, a free weather service. Needs an internet connection.'}),
    w&&w.lat!=null?h('div',{class:'card row'},h('div',{class:'grow'},h('b',{text:w.name}),h('div',{class:'muted small',text:'Current location'})),h('button',{class:'danger',onclick:function(){S.weather=null;save();render()},text:'Turn off'})):h('p',{class:'muted',text:'Weather is off.'}),
    opts,inp,h('button',{class:'primary',onclick:search,text:'Find my city'}),msg,res)
}
function selNew(el){if(/^New /.test(el.value))setTimeout(function(){try{el.setSelectionRange(0,el.value.length)}catch(e){}},0)}
var WXSTEPS={snow:['Put on your boots and warm coat','Put away your boots and coat'],freeze:['Put on your heavy coat','Hang up your heavy coat'],rain:['Put on your raincoat and boots','Hang up your raincoat and put away your boots'],chilly:['Put on your jacket','Hang up your jacket']};
function wxRid(w,which){var id=which==='m'?w.morn:w.aft;if(id==='none')return null;if(id&&by(S.routines,id))return id;
  var re=which==='m'?/morning/i:/after/i,r=S.routines.filter(function(x){return re.test(x.name)})[0];return r?r.id:null}
function wxExtra(rid){var w=S.weather;if(!w||w.lat==null||w.auto===false||!w.cache||w.cache.d!==dayStr(0)||!w.cache.a||!w.cache.a.cat)return [];
  var s=WXSTEPS[w.cache.a.cat];if(!s)return [];
  var ic={snow:'🥾',freeze:'🧥',rain:'☔',chilly:'🧥'}[w.cache.a.cat];
  if(rid===wxRid(w,'m'))return [{id:'wx-m',title:s[0],instructions:'',icon:ic,wx:1}];
  if(rid===wxRid(w,'a'))return [{id:'wx-a',title:s[1],instructions:'',icon:ic,wx:1}];
  return []}
function speak(s){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
var timer={end:0,key:''};
function tmText(){var s=Math.max(0,Math.round((timer.end-Date.now())/1000));return s?Math.floor(s/60)+':'+('0'+s%60).slice(-2):'Time’s up'}
setInterval(function(){var el=document.getElementById('tmr');if(el&&timer.end)el.textContent=tmText()},500);
function plural(n){return n+(n===1?' step':' steps')}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function twoTap(btn,key,msg,fn){if(armed!==key){armed=key;btn.textContent=msg;return}fn()}
function topBar(label,to){return h('div',{class:'top'},h('button',{class:'ghost',onclick:function(){go(to)},text:label}))}

function home(){
  var list=h('div',{class:'stack'});
  S.kids.forEach(function(k){list.appendChild(h('button',{class:'routine','data-c':kidColor(k),onclick:function(){go({name:'kidhome',kid:k.id})}},h('b',{text:k.name})))});
  if(!S.kids.length)list.appendChild(h('p',{class:'muted',text:'No children yet. A grown-up can add one.'}));
  return h('div',{class:'stack'},
    h('div',{class:'top'},h('h1',{text:'FlowLine'}),h('button',{class:'ghost',onclick:function(){go({name:'parent',tab:'today'})},text:'Grown-ups'})),
    h('p',{class:'muted',text:'Who’s up?'}),list)

    wrap.appendChild(h('div',{class:'card row'},h('div',{class:'grow'},h('b',{text:r.name}),h('div',{class:'muted small',text:plural(tasksOf(k.id,r.id).length)})),
      h('button',{onclick:function(){go({name:'edit',kid:k.id,rid:r.id})},text:'Edit steps'})))});
  var del=h('button',{class:'danger',onclick:function(){twoTap(this,'k'+k.id,'Tap again to delete this child',function(){
    S.kids=S.kids.filter(function(x){return x.id!==k.id});
    Object.keys(S.tasks).forEach(function(key){if(key.split(':')[0]===k.id)delete S.tasks[key]});
    Object.keys(S.bonus).forEach(function(key){if(key.split(':')[0]===k.id)delete S.bonus[key]});
    S.bonusLog=S.bonusLog.filter(function(b){return b.kid!==k.id});S.once=S.once.filter(function(o){return o.kid!==k.id});
    S.log=S.log.filter(function(l){return l.kid!==k.id});save();go({name:'parent',tab:'kids'})})},text:'Delete child'});
  wrap.appendChild(h('button',{class:'primary',style:'min-height:64px',onclick:function(){go({name:'parent',tab:'kids'})},text:'Done'}));
  wrap.appendChild(del);
  return wrap
}

function edit(){
  var k=by(S.kids,V.kid),r=by(S.routines,V.rid);if(!k||!r)return parent();
  var ts=tasksOf(k.id,r.id),wrap=h('div',{class:'stack'});
  wrap.appendChild(h('div',{class:'top'},h('button',{class:'ghost',onclick:function(){go({name:'kidedit',kid:k.id})},text:'‹ '+k.name}),h('span',{class:'muted small',text:'Saved on this device'})));
  wrap.appendChild(h('h1',{text:r.name}));
  wrap.appendChild(h('p',{class:'muted',text:'Steps for '+k.name}));
  var wxs=wxExtra(r.id);if(wxs.length)wrap.appendChild(h('p',{class:'muted small',text:'Today’s weather step is added automatically: “'+wxs[0].title+'”.'}));
  var dk=k.id+':'+r.id,drow=h('div',{class:'row',style:'gap:6px'});
  wrap.appendChild(h('span',{class:'muted small',text:'Days this routine runs'}));
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(n,di){
    var on=onDay(k.id,r.id,di);
    drow.appendChild(h('button',{class:'chip'+(on?' on':''),'aria-pressed':on?'true':'false',onclick:function(){var a=S.days[dk]||(S.days[dk]=[true,true,true,true,true,true,true]);a[di]=!on;save();render()},text:n}))});
  wrap.appendChild(drow);
  if(!ts.length)wrap.appendChild(h('p',{class:'muted',text:'Add the first step below.'}));
  ts.forEach(function(t,i){
    function move(d){var j=i+d;if(j<0||j>=ts.length)return;var x=ts[i];ts[i]=ts[j];ts[j]=x;save();render()}
    var up=h('button',{class:'iconbtn','aria-label':'Move up',onclick:function(){move(-1)},text:'↑'}),dn=h('button',{class:'iconbtn','aria-label':'Move down',onclick:function(){move(1)},text:'↓'});
    if(i===0)up.disabled=true;if(i===ts.length-1)dn.disabled=true;
    var ib=h('button',{class:'iconbtn','aria-label':'Choose picture',style:'min-width:64px;font-size:1.5rem',onclick:function(){pickId=pickId===t.id?null:t.id;render()},text:iconBtn(t)});
    wrap.appendChild(h('div',{class:'card stack'},
      h('div',{class:'row'},h('input',{type:'text',class:'grow','data-f':t.id,placeholder:'Step name',value:t.title,'aria-label':'Step '+(i+1)+' title',oninput:function(){t.title=this.value;save();ib.textContent=iconBtn(t)}}),up,dn),
      h('input',{type:'text',value:t.instructions||'',placeholder:'Short instruction (optional)','aria-label':'Instruction',oninput:function(){t.instructions=this.value;save()}}),
      h('div',{class:'row'},ib,h('input',{type:'text',inputmode:'numeric',value:t.minutes||'',placeholder:'Timer (min)',style:'width:120px','aria-label':'Timer minutes',oninput:function(){t.minutes=parseInt(this.value,10)||0;save()}}),h('span',{class:'muted small',text:'Picture and optional timer'})),
      pickId===t.id?picker(t):null,
      h('button',{class:'danger',onclick:function(){ts.splice(i,1);save();render()},text:'Remove step'})));
  });
  wrap.appendChild(h('button',{class:'primary',onclick:function(){var n=T('');ts.push(n);focusId=n.id;save();render()},text:'Add step'}));
  function addOnce(d){var o={id:uid(),kid:k.id,rid:r.id,date:d,title:'',instructions:''};S.once.push(o);focusId=o.id;save();render()}
  wrap.appendChild(h('h2',{text:'One-time steps'}));
  wrap.appendChild(h('p',{class:'muted small',text:'For one day only, like a shower. They appear at the end of the routine.'}));
  var td=dayStr(0),tm=dayStr(1),doneToday=S.log.some(function(l){return l.kid===k.id&&l.rid===r.id&&dayKey(l.t)===dayKey(Date.now())});
  S.once.filter(function(o){return o.kid===k.id&&o.rid===r.id&&o.date>=td}).sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(o){
    wrap.appendChild(h('div',{class:'card stack'},h('span',{class:'muted small',text:o.date===td?'Today':'Tomorrow'}),
      h('input',{type:'text','data-f':o.id,placeholder:'Step name',value:o.title,'aria-label':'One-time step',oninput:function(){o.title=this.value;save()}}),
      h('button',{class:'danger',onclick:function(){S.once=S.once.filter(function(x){return x.id!==o.id});save();render()},text:'Remove'})))});
  var orow=h('div',{class:'row'}),bt=h('button',{class:'grow',onclick:function(){addOnce(td)},text:'Add for today'});
  if(doneToday)bt.disabled=true;
  orow.appendChild(bt);orow.appendChild(h('button',{class:'grow',onclick:function(){addOnce(tm)},text:'Add for tomorrow'}));
  wrap.appendChild(orow);
  if(doneToday)wrap.appendChild(h('p',{class:'muted small',text:k.name+' already finished this routine today, so new steps go to tomorrow.'}));
  wrap.appendChild(h('h2',{text:'Bonus steps'}));
  wrap.appendChild(h('p',{class:'muted small',text:'Optional, up to 3. After finishing this routine, '+k.name+' can pick one bonus step per day.'}));
  var bs=bonusOf(k.id,r.id);
  bs.forEach(function(b,i){
    var sel=h('select',{'aria-label':'Reward',onchange:function(){b.reward=this.value;save()}});
    sel.appendChild(h('option',{value:'',text:'No reward'}));
    S.rewards.forEach(function(x){sel.appendChild(h('option',{value:x.id,text:x.text}))});
    sel.value=b.reward||'';
    wrap.appendChild(h('div',{class:'card stack'},
      h('input',{type:'text','data-f':b.id,placeholder:'Bonus step name',value:b.title,'aria-label':'Bonus step title',oninput:function(){b.title=this.value;save()}}),
      h('input',{type:'text',value:b.instructions||'',placeholder:'Short instruction (optional)','aria-label':'Instruction',oninput:function(){b.instructions=this.value;save()}}),
      sel,
      h('button',{class:'danger',onclick:function(){bs.splice(i,1);save();render()},text:'Remove bonus step'})));
  });
  var addb=h('button',{onclick:function(){var nb={id:uid(),title:'',instructions:'',reward:''};bs.push(nb);focusId=nb.id;save();render()},text:'Add bonus step'});
  if(bs.length>=3)addb.disabled=true;
  wrap.appendChild(addb);
  var others=S.kids.filter(function(x){return x.id!==k.id});
  if(others.length){
    var sel=h('select',{'aria-label':'Copy steps from'});others.forEach(function(o){sel.appendChild(h('option',{value:o.id,text:o.name}))});
    var cb=h('button',{onclick:function(){twoTap(this,'copy','Tap again to replace',function(){
      S.tasks[k.id+':'+r.id]=tasksOf(sel.value,r.id).map(function(t){return Object.assign(T(t.title,t.instructions),{icon:t.icon,minutes:t.minutes})});save();go(V)})},text:'Copy'});
    wrap.appendChild(h('div',{class:'card stack'},h('span',{class:'muted small',text:'Copy this routine’s steps from another child (replaces these steps)'}),h('div',{class:'row'},sel,cb)));
  }
  wrap.appendChild(h('button',{class:'primary',style:'min-height:64px',onclick:function(){go({name:'kidedit',kid:k.id})},text:'Done'}));
  return wrap
}

function render(){
  var app=document.getElementById('app');app.textContent='';
  var v={home:home,kidhome:kidhome,kid:kid,done:done,parent:parent,kidnew:kidnew,kidedit:kidedit,edit:edit,bonuspick:bonuspick,bonus:bonus,bonusdone:bonusdone,pin:pin,backup:backup,weather:weather}[V.name]||home;
  var KS={kidhome:1,kid:1,done:1,bonuspick:1,bonus:1,bonusdone:1},ck=KS[V.name]&&by(S.kids,V.kid);
  if(ck)document.body.setAttribute('data-c',kidColor(ck));else document.body.removeAttribute('data-c');
  app.appendChild(v());
  if(focusId){var f=app.querySelector('[data-f="'+focusId+'"]');focusId=null;if(f){f.focus();try{f.select();f.setSelectionRange(0,f.value.length)}catch(e){}}}
}
render();
</script>
</body>
